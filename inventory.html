<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>جرد البضائع</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e2e5e9;
    --border-strong: #c9ced4;
    --text: #1f2328;
    --muted: #636b74;
    --primary: #1a6fe0;
    --primary-text: #ffffff;
    --plus-bg: #e6f4ea;
    --plus-text: #17692f;
    --plus-border: #b9dcc4;
    --minus-bg: #fdecea;
    --minus-text: #b3261e;
    --minus-border: #f3c4bf;
    --hover: #eef0f2;
    --toast-bg: #2b2f33;
    --toast-text: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121316;
      --card: #1c1e22;
      --border: #2e3136;
      --border-strong: #454a51;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --primary: #6aa5f5;
      --primary-text: #0d1b2e;
      --plus-bg: #1d3325;
      --plus-text: #8fd6a4;
      --plus-border: #2f5a3e;
      --minus-bg: #3a2220;
      --minus-text: #f2a9a2;
      --minus-border: #6a3a36;
      --hover: #272a2f;
      --toast-bg: #e8eaed;
      --toast-text: #1f2328;
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  button, input { font-family: inherit; font-size: inherit; color: inherit; }

  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .app { max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }

  /* ---------- الترويسة ---------- */
  .top {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 0 14px;
    background: var(--bg);
  }

  .top h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .btn-outline:hover { background: var(--hover); }

  /* ---------- القائمة والبطاقات ---------- */
  .list { list-style: none; margin: 0; padding: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px 14px;
    margin-bottom: 10px;
  }

  .card-head { display: flex; align-items: center; gap: 6px; }

  .name-input {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    font-size: 1.05rem;
    font-weight: 600;
    text-align: start;
  }
  .name-input:hover { border-color: var(--border); }
  .name-input:focus { border-color: var(--primary); outline: none; background: var(--card); }

  .icon-btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: var(--muted);
    opacity: 0.75;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--hover); opacity: 1; }

  .qty {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-top: 8px;
    padding: 0 8px;
  }

  .qty-info { display: flex; flex-direction: column; line-height: 1.2; }
  .qty-label { font-size: 0.8rem; color: var(--muted); }
  .qty-value {
    font-size: 2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  .qty-controls { display: flex; align-items: center; gap: 6px; }

  .step {
    width: 42px;
    height: 42px;
    padding: 0;
    border-radius: 10px;
    border: 1px solid;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
  }
  .step.plus  { background: var(--plus-bg);  color: var(--plus-text);  border-color: var(--plus-border); }
  .step.minus { background: var(--minus-bg); color: var(--minus-text); border-color: var(--minus-border); }
  .step:active { filter: brightness(0.95); }

  .amount-input {
    width: 78px;
    height: 42px;
    padding: 0 8px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  .amount-input:focus { border-color: var(--primary); outline: none; }
  .amount-input::placeholder { color: var(--muted); font-size: 0.85rem; }

  /* ---------- تأكيد الحذف ---------- */
  .confirm-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 8px;
  }
  .confirm-bar[hidden] { display: none; }
  .confirm-text { flex: 1; min-width: 150px; font-size: 0.9rem; }

  .btn-small {
    padding: 6px 14px;
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .btn-small:hover { background: var(--hover); }
  .btn-small.danger { background: var(--minus-bg); color: var(--minus-text); border-color: var(--minus-border); }
  .btn-small.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }

  /* ---------- بطاقة المنتج الجديد ---------- */
  .card.draft { border-color: var(--primary); }
  .draft .name-input { border-color: var(--border-strong); background: var(--card); }
  .draft .name-input:focus { border-color: var(--primary); }
  .draft-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-top: 10px;
    padding: 0 8px;
  }
  .draft-qty { display: flex; align-items: center; gap: 8px; }
  .draft-qty label { font-size: 0.85rem; color: var(--muted); }
  .draft-qty .amount-input { width: 96px; }

  /* ---------- زر الإضافة العائم ---------- */
  .fab-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: flex;
    justify-content: flex-end; /* في الاتجاه من اليمين لليسار يظهر الزر في الجهة اليسرى */
    width: min(100%, 640px);
    margin: 0 auto;
    padding: 20px;
    pointer-events: none;
  }
  .fab {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    padding: 0;
    background: var(--primary);
    color: var(--primary-text);
    border: none;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    cursor: pointer;
  }
  .fab:active { filter: brightness(0.92); }

  /* ---------- رسالة قصيرة ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 96px;
    z-index: 20;
    max-width: calc(100% - 32px);
    padding: 10px 16px;
    background: var(--toast-bg);
    color: var(--toast-text);
    border-radius: 8px;
    font-size: 0.9rem;
    text-align: center;
    opacity: 0;
    transform: translateX(-50%);
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }

  /* ---------- الهاتف ---------- */
  @media (max-width: 480px) {
    .app { padding-left: 12px; padding-right: 12px; }
    .top h1 { font-size: 1.3rem; }
    .qty { flex-direction: column; align-items: stretch; padding: 0; }
    .qty-info { align-items: center; }
    .qty-controls { justify-content: center; }
    .qty-controls .amount-input { flex: 1; max-width: 140px; }
    .draft-row { padding: 0; }
    .draft-qty { flex: 1; }
    .draft-qty .amount-input { flex: 1; width: auto; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>جرد البضائع</h1>
    <button id="exportBtn" class="btn-outline" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
      تصدير الجرد
    </button>
  </header>

  <main>
    <ul id="list" class="list" aria-label="قائمة المنتجات"></ul>
  </main>
</div>

<div class="fab-bar">
  <button id="addBtn" class="fab" type="button" aria-label="إضافة منتج جديد" title="إضافة منتج">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ================= الثوابت ================= */
  const STORAGE_KEY = 'inventory-app-v1';
  const MAX_QUANTITY = 999999999;
  const NAME_MAX_LENGTH = 80;

  const ICON_TRASH = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
  const ICON_CLOSE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  /* ================= الحالة ================= */
  let products = [];       // [{ id, name, quantity }] بنفس ترتيب العرض
  let draftCard = null;    // بطاقة المنتج الجديد المفتوحة (إن وُجدت)
  let toastTimer = null;
  let storageWarningShown = false;

  const listEl = document.getElementById('list');
  const toastEl = document.getElementById('toast');

  /* ================= أدوات مساعدة ================= */
  function el(tag, className, props) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (props) Object.assign(node, props);
    return node;
  }

  function formatNumber(n) {
    return Number(n).toLocaleString('en-US');
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2800);
  }

  // تحويل الأرقام العربية والفارسية إلى لاتينية
  function normalizeDigits(text) {
    return String(text)
      .replace(/[\u0660-\u0669]/g, function (d) { return d.charCodeAt(0) - 0x0660; })
      .replace(/[\u06F0-\u06F9]/g, function (d) { return d.charCodeAt(0) - 0x06F0; });
  }

  // إبقاء الأرقام الصحيحة الموجبة فقط (لا إشارات ولا فواصل عشرية)
  function sanitizeDigits(text) {
    return normalizeDigits(text).replace(/\D/g, '').slice(0, 9);
  }

  // يعيد null إذا كان الحقل فارغًا
  function parseAmount(text) {
    const digits = sanitizeDigits(text);
    return digits === '' ? null : parseInt(digits, 10);
  }

  function cleanName(text) {
    return String(text).replace(/\s+/g, ' ').trim();
  }

  /* ================= التخزين المحلي ================= */
  function loadProducts() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter(function (p) {
          return p && typeof p.name === 'string' && cleanName(p.name) !== '';
        })
        .map(function (p) {
          let qty = Number(p.quantity);
          if (!Number.isFinite(qty) || qty < 0) qty = 0;
          qty = Math.min(Math.floor(qty), MAX_QUANTITY);
          return {
            id: typeof p.id === 'string' && p.id ? p.id : newId(),
            name: cleanName(p.name).slice(0, NAME_MAX_LENGTH),
            quantity: qty
          };
        });
    } catch (err) {
      console.error('تعذر قراءة البيانات المحفوظة:', err);
      return [];
    }
  }

  function saveProducts() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
      return true;
    } catch (err) {
      console.error('تعذر حفظ البيانات:', err);
      if (!storageWarningShown) {
        storageWarningShown = true;
        showToast('تعذّر حفظ البيانات في المتصفح، لن تبقى بعد إغلاق الصفحة');
      }
      return false;
    }
  }

  function findProduct(id) {
    return products.find(function (p) { return p.id === id; });
  }

  /* ================= بناء البطاقات ================= */
  function createAmountInput(placeholder, label) {
    const input = el('input', 'amount-input', { type: 'text', placeholder: placeholder });
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input.maxLength = 12;
    input.setAttribute('aria-label', label);
    return input;
  }

  function createStepButton(action, symbol, label) {
    const btn = el('button', 'step ' + action, { type: 'button', textContent: symbol });
    btn.dataset.action = action;
    btn.setAttribute('aria-label', label);
    btn.title = label;
    return btn;
  }

  function createProductCard(product) {
    const card = el('li', 'card');
    card.dataset.id = product.id;

    // القسم العلوي: اسم المنتج + زر الحذف
    const head = el('div', 'card-head');
    const nameInput = el('input', 'name-input', {
      type: 'text',
      value: product.name,
      maxLength: NAME_MAX_LENGTH
    });
    nameInput.setAttribute('aria-label', 'اسم المنتج');
    const deleteBtn = el('button', 'icon-btn', { type: 'button', title: 'حذف المنتج' });
    deleteBtn.dataset.action = 'ask-delete';
    deleteBtn.setAttribute('aria-label', 'حذف المنتج');
    deleteBtn.innerHTML = ICON_TRASH;
    head.append(nameInput, deleteBtn);

    // قسم الكمية
    const qty = el('div', 'qty');
    const info = el('div', 'qty-info');
    info.append(
      el('span', 'qty-label', { textContent: 'الكمية الحالية' }),
      el('span', 'qty-value', { textContent: formatNumber(product.quantity) })
    );
    const controls = el('div', 'qty-controls');
    controls.dir = 'ltr';
    controls.append(
      createStepButton('minus', '\u2212', 'خصم من الكمية'),
      createAmountInput('العدد', 'العدد المراد إضافته أو خصمه'),
      createStepButton('plus', '+', 'زيادة الكمية')
    );
    qty.append(info, controls);

    // شريط تأكيد الحذف
    const confirmBar = el('div', 'confirm-bar');
    confirmBar.hidden = true;
    const confirmYes = el('button', 'btn-small danger', { type: 'button', textContent: 'حذف' });
    confirmYes.dataset.action = 'confirm-delete';
    const confirmNo = el('button', 'btn-small', { type: 'button', textContent: 'إلغاء' });
    confirmNo.dataset.action = 'cancel-delete';
    confirmBar.append(
      el('span', 'confirm-text', { textContent: 'هل تريد حذف هذا المنتج نهائيًا؟' }),
      confirmYes,
      confirmNo
    );

    card.append(head, qty, confirmBar);
    return card;
  }

  /* ================= بطاقة منتج جديد ================= */
  function openDraftCard() {
    if (draftCard) {
      draftCard.querySelector('.name-input').focus();
      draftCard.scrollIntoView({ block: 'center' });
      return;
    }

    const card = el('li', 'card draft');

    const head = el('div', 'card-head');
    const nameInput = el('input', 'name-input', {
      type: 'text',
      placeholder: 'اسم المنتج',
      maxLength: NAME_MAX_LENGTH
    });
    nameInput.setAttribute('aria-label', 'اسم المنتج الجديد');
    const cancelBtn = el('button', 'icon-btn', { type: 'button', title: 'إلغاء' });
    cancelBtn.setAttribute('aria-label', 'إلغاء إضافة المنتج');
    cancelBtn.innerHTML = ICON_CLOSE;
    head.append(nameInput, cancelBtn);

    const row = el('div', 'draft-row');
    const qtyWrap = el('div', 'draft-qty');
    const qtyId = 'draftQty';
    const qtyLabel = el('label', null, { textContent: 'الكمية الابتدائية' });
    qtyLabel.htmlFor = qtyId;
    const qtyInput = createAmountInput('0', 'الكمية الابتدائية');
    qtyInput.id = qtyId;
    qtyWrap.append(qtyLabel, qtyInput);
    const addBtn = el('button', 'btn-small primary', { type: 'button', textContent: 'إضافة' });
    row.append(qtyWrap, addBtn);

    card.append(head, row);

    function submitDraft() {
      const name = cleanName(nameInput.value);
      if (name === '') {
        showToast('اكتب اسم المنتج أولًا');
        nameInput.focus();
        return;
      }
      const initial = parseAmount(qtyInput.value);
      const quantity = initial === null ? 0 : initial;

      const product = { id: newId(), name: name, quantity: quantity };
      products.push(product);
      saveProducts();

      closeDraftCard();
      const productCard = createProductCard(product);
      listEl.appendChild(productCard);
      productCard.scrollIntoView({ block: 'center' });
    }

    addBtn.addEventListener('click', submitDraft);
    cancelBtn.addEventListener('click', closeDraftCard);
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeDraftCard();
      } else if (e.key === 'Enter' && e.target === nameInput) {
        e.preventDefault();
        if (cleanName(nameInput.value) === '') {
          showToast('اكتب اسم المنتج أولًا');
        } else {
          qtyInput.focus();
        }
      } else if (e.key === 'Enter' && e.target === qtyInput) {
        e.preventDefault();
        submitDraft();
      }
    });

    listEl.appendChild(card);
    draftCard = card;
    nameInput.focus();
    card.scrollIntoView({ block: 'center' });
  }

  function closeDraftCard() {
    if (draftCard) {
      draftCard.remove();
      draftCard = null;
    }
  }

  /* ================= تعديل الكمية ================= */
  function updateQuantityDisplay(card, quantity) {
    card.querySelector('.qty-value').textContent = formatNumber(quantity);
  }

  // direction: 1 للزيادة، -1 للخصم
  function changeQuantity(card, direction) {
    const product = findProduct(card.dataset.id);
    if (!product) return;

    const input = card.querySelector('.amount-input');
    const amount = parseAmount(input.value);

    if (amount === null) return;          // الحقل فارغ: لا تنفذ شيئًا
    if (amount <= 0) {
      showToast('أدخل عددًا أكبر من صفر');
      return;
    }
    if (direction < 0 && amount > product.quantity) {
      showToast('الكمية غير كافية. المتاح حاليًا: ' + formatNumber(product.quantity));
      return;
    }

    const next = product.quantity + direction * amount;
    if (next > MAX_QUANTITY) {
      showToast('الكمية الناتجة كبيرة جدًا');
      return;
    }

    product.quantity = next;
    saveProducts();
    updateQuantityDisplay(card, next);
    input.value = '';
  }

  /* ================= تعديل الاسم ================= */
  function renameProduct(card, input) {
    const product = findProduct(card.dataset.id);
    if (!product) return;
    const name = cleanName(input.value);
    if (name === '') {
      input.value = product.name;
      showToast('لا يمكن ترك اسم المنتج فارغًا');
      return;
    }
    input.value = name;
    if (name !== product.name) {
      product.name = name;
      saveProducts();
    }
  }

  /* ================= الحذف ================= */
  function deleteProduct(card) {
    const id = card.dataset.id;
    products = products.filter(function (p) { return p.id !== id; });
    saveProducts();
    card.remove();
  }

  /* ================= أحداث القائمة ================= */
  listEl.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const card = btn.closest('.card');
    if (!card || !card.dataset.id) return;

    switch (btn.dataset.action) {
      case 'plus':
        changeQuantity(card, 1);
        break;
      case 'minus':
        changeQuantity(card, -1);
        break;
      case 'ask-delete': {
        const bar = card.querySelector('.confirm-bar');
        bar.hidden = false;
        bar.querySelector('[data-action="cancel-delete"]').focus();
        break;
      }
      case 'cancel-delete':
        card.querySelector('.confirm-bar').hidden = true;
        break;
      case 'confirm-delete':
        deleteProduct(card);
        break;
    }
  });

  // إبقاء حقول الكمية أرقامًا صحيحة فقط
  listEl.addEventListener('input', function (e) {
    if (e.target.classList.contains('amount-input')) {
      const clean = sanitizeDigits(e.target.value);
      if (clean !== e.target.value) e.target.value = clean;
    }
  });

  listEl.addEventListener('keydown', function (e) {
    const card = e.target.closest('.card');
    if (!card || !card.dataset.id) return; // بطاقة المنتج الجديد تدير أحداثها بنفسها

    if (e.target.classList.contains('amount-input') && e.key === 'Enter') {
      e.preventDefault();
      changeQuantity(card, 1);
    } else if (e.target.classList.contains('name-input')) {
      if (e.key === 'Enter') {
        e.preventDefault();
        e.target.blur();
      } else if (e.key === 'Escape') {
        const product = findProduct(card.dataset.id);
        if (product) e.target.value = product.name;
        e.target.blur();
      }
    }
  });

  listEl.addEventListener('change', function (e) {
    const card = e.target.closest('.card');
    if (!card || !card.dataset.id) return;
    if (e.target.classList.contains('name-input')) {
      renameProduct(card, e.target);
    }
  });

  /* ================= التصدير ================= */
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function csvCell(value) {
    return '"' + String(value).replace(/"/g, '""') + '"';
  }

  function exportCsv(header, rows) {
    const lines = [header].concat(rows).map(function (row) {
      return row.map(csvCell).join(',');
    });
    // BOM لضمان ظهور الحروف العربية بشكل صحيح في Excel
    const content = '\uFEFF' + lines.join('\r\n');
    downloadBlob(new Blob([content], { type: 'text/csv;charset=utf-8;' }), 'inventory.csv');
  }

  function exportInventory() {
    if (products.length === 0) {
      showToast('لا توجد بيانات للتصدير');
      return;
    }

    const header = ['الرقم', 'اسم المنتج', 'الكمية الحالية'];
    const rows = products.map(function (p, index) {
      return [index + 1, p.name, p.quantity];
    });

    // المحاولة الأولى: ملف XLSX عبر SheetJS إذا تم تحميل المكتبة
    if (window.XLSX) {
      try {
        const sheet = XLSX.utils.aoa_to_sheet([header].concat(rows));
        sheet['!cols'] = [{ wch: 8 }, { wch: 32 }, { wch: 16 }];
        const workbook = XLSX.utils.book_new();
        workbook.Workbook = { Views: [{ RTL: true }] };
        XLSX.utils.book_append_sheet(workbook, sheet, 'الجرد');
        XLSX.writeFile(workbook, 'inventory.xlsx');
        showToast('تم تصدير الجرد (inventory.xlsx)');
        return;
      } catch (err) {
        console.error('فشل تصدير XLSX، سيتم استخدام CSV:', err);
      }
    }

    // البديل: ملف CSV بترميز UTF-8 مع BOM
    exportCsv(header, rows);
    showToast('تم تصدير الجرد بصيغة CSV (inventory.csv)');
  }

  /* ================= التشغيل ================= */
  document.getElementById('addBtn').addEventListener('click', openDraftCard);
  document.getElementById('exportBtn').addEventListener('click', exportInventory);

  products = loadProducts();
  products.forEach(function (p) { listEl.appendChild(createProductCard(p)); });
})();
</script>
</body>
</html>
